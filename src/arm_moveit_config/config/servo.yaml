# moveit_servo (Jazzy 2.12.4) configuration for the BabyROS arm_6dof.
# Consumes twist commands on /cmd_vel (published by teleop_twist_joy) and
# publishes JointTrajectory commands for the joint_trajectory_controller.
/**:
  ros__parameters:
    moveit_servo:
      move_group_name: arm
      command_in_type: speed_units
      cartesian_command_in_topic: /cmd_vel
      command_out_type: trajectory_msgs/JointTrajectory
      command_out_topic: /joint_trajectory_controller/joint_trajectory
      publish_joint_positions: true
      publish_joint_velocities: true
      publish_period: 0.02
      joint_limit_margins: [0.05]
      scale:
        linear: 0.3
        rotational: 0.3
        joint: 0.5
      check_collisions: true
      collision_check_rate: 10.0
      self_collision_proximity_threshold: 0.01
      scene_collision_proximity_threshold: 0.01
      incoming_command_timeout: 0.5
